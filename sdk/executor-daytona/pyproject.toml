[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "zeta-executor-daytona"
version = "0.1.0"
description = "Daytona executor driver for Zeta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "daytona>=0.100.0",
  "zeta-plugin>=0.2.0",
]

[project.entry-points."zeta.providers"]
daytona = "zeta_executor_daytona:provider"

[tool.hatch.build.targets.wheel]
packages = ["src/zeta_executor_daytona"]
