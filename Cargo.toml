# Exact pins keep hash and protocol behavior reproducible.
# BLAKE3 is pinned because hash stability is part of the data format.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "=0.22.1"
blake3 = { version = "=1.5.5", features = ["mmap"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
croner = "3"
jsonschema = { version = "0.33", default-features = false }
minijinja = { version = "2", default-features = false, features = ["builtins", "macros", "serde"] }
num-bigint = "0.4"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "0.38", features = ["fs", "process", "stdio"] }
rustpython-format = { version = "0.4", default-features = false, features = ["num-bigint"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
yaml_serde = "=0.10.4"
proptest = "=1.6.0"
tempfile = "=3.15.0"
