# Exact pins keep hash and protocol behavior reproducible.
# BLAKE3 is pinned because hash stability is part of the data format.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "=0.22.1"
blake3 = { version = "=1.5.5", features = ["mmap"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
proptest = "=1.6.0"
tempfile = "=3.15.0"
