[package]
name = "zeta"
description = "Native application host for the zeta ecosystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
croner.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zeta-agent = { path = "../zeta-agent" }
zeta-manifest = { path = "../zeta-manifest" }
zeta-dispatch = { path = "../zeta-dispatch" }
zeta-ipc = { path = "../zeta-ipc" }
zeta-journal = { path = "../zeta-journal" }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
